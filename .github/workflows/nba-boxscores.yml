name: NBA box scores

# Runs after the last west-coast game has finished. 09:15 UTC is about 05:15 in
# New York and 02:15 in Los Angeles, which clears even a late overrunning game.
# The second run is a safety net: if the feed had not published a box score on
# the first pass, the retry picks it up without anyone touching it.
on:
  schedule:
    - cron: '15 9 * * *'
    - cron: '15 15 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Backfill from this date (YYYY-MM-DD). Leave blank for the normal nightly run.'
        required: false
        default: ''
      probe:
        description: 'Only report which feeds are reachable, scrape nothing.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write           # needed so the job can commit the data back

concurrency:
  group: nba-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet pandas pyarrow

      - name: Scrape box scores
        run: |
          if [ "${{ inputs.probe }}" = "true" ]; then
            python scrape_nba.py --probe
          elif [ -n "${{ inputs.since }}" ]; then
            python scrape_nba.py --since "${{ inputs.since }}"
          else
            python scrape_nba.py
          fi

      # Commit what validated, even if a later game in the same run failed.
      #
      # This step previously did `git pull --rebase --autostash || true` before
      # pushing, and that destroyed a night's work. The data file is a PARQUET:
      # git cannot merge it, so any diverged remote turns the rebase into an
      # unresolvable conflict. The `|| true` then swallowed the failure and left
      # the repo mid-rebase on a detached HEAD, and the push died with
      # "You are not currently on a branch", exit 128. The scraped games were
      # already committed locally at that point and went in the bin with the
      # workspace.
      #
      # So: never rebase a binary. On a rejected push, treat the REMOTE as the
      # truth, throw our commit away, and re-run the scraper against it. The
      # scraper reads the existing file, de-duplicates by game, and adds only
      # what is missing, so re-deriving on top of the remote is exactly
      # equivalent to a merge and cannot conflict. Three attempts, then fail
      # loudly rather than pretend.
      - name: Commit any new data
        if: always()
        run: |
          set -euo pipefail
          git config user.name  "nba-scraper"
          git config user.email "actions@github.com"
          BR="${GITHUB_REF_NAME}"
          # under `set -e`, `git status <path>` on a path that does not exist is
          # a non-zero exit and would abort the step. A probe run scrapes
          # nothing, and `if: always()` means this still runs after a failure,
          # so the directory is not guaranteed to be there.
          mkdir -p data

          for attempt in 1 2 3; do
            if [ -z "$(git status --porcelain data)" ]; then
              echo "nothing new to commit"
              exit 0
            fi

            git add data
            git commit -m "box scores: $(date -u +%Y-%m-%d)"

            if git push origin "HEAD:${BR}"; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi

            echo "::warning::push rejected; re-deriving on top of the remote (attempt ${attempt})"
            git fetch origin "${BR}"
            git reset --hard "origin/${BR}"
            # A failure here is genuinely tolerable, unlike the one that caused
            # this: the `git status` check at the top of the next pass decides
            # whether there is anything to commit, so a bad scrape simply leaves
            # the tree clean and the loop exits reporting nothing new.
            python scrape_nba.py || echo "::warning::re-scrape failed on attempt ${attempt}"
          done

          echo "::error::could not push after 3 attempts" >&2
          exit 1fi
